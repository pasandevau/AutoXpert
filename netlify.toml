# TanStack Start on Netlify — https://docs.netlify.com/build/frameworks/framework-setup-guides/tanstack-start/
# Install the Netlify adapter here so local package-lock stays in sync without requiring it on every dev machine.
[build]
  command = "npm install --no-save @netlify/vite-plugin-tanstack-start@1.3.9 && npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"
